# Draft JetStream cluster for Квартирник.
# One file for every node. Each container sets its own name:
#   nats-server -c /etc/nats/kvartirnik.conf --server_name nats-1
# Clients on the phone do not connect here. There is no auth in this draft.

port: 4222
http_port: 8222

jetstream {
  store_dir: /data
}

cluster {
  name: kvartirnik
  listen: 0.0.0.0:6222
  routes: [
    nats://nats-1:6222
    nats://nats-2:6222
    nats://nats-3:6222
  ]
}
